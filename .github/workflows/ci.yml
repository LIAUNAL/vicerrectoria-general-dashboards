name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and data contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies to install: the project runs on the Node standard
      # library, so there is nothing to resolve, cache or audit.
      - name: Run tests
        run: npm test

      - name: Validate the published board
        run: npm run check

      - name: Build the site
        run: npm run build
